name: macos-signing-canary
run-name: "macOS signing canary (${{ inputs.release_tag }})"

# Proves the Developer ID and notarization secrets without tagging a release: it
# re-signs an existing release's Darwin binaries with the release signing script and
# uploads the notarized copies as a short-lived workflow artifact. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release whose Darwin binaries are re-signed (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download Darwin release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir canary-download --pattern '*_darwin_*.tar.gz'
          for arch in arm64 amd64; do
            mkdir -p "canary/${arch}"
            tar -xzf "canary-download/comment-checker_${RELEASE_TAG}_darwin_${arch}.tar.gz" -C "canary/${arch}" comment-checker
          done

      - name: Sign and notarize with the release script
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: "true"
        run: bash .github/scripts/macos-sign-and-notarize.sh --identifier ai.sisyphuslabs.comment-checker canary/arm64/comment-checker canary/amd64/comment-checker

      - name: Run the signed binary
        run: |
          set -euo pipefail
          printf '%s' '{"tool_name":"Write","tool_input":{"file_path":"a.ts","content":"const a = 1 // one"}}' | canary/arm64/comment-checker || [ "$?" -eq 2 ]
          codesign -dv --verbose=2 canary/*/comment-checker

      - name: Upload notarized canary binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-signing-canary
          path: canary/
          retention-days: 3
          if-no-files-found: error
