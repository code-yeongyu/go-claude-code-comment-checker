name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  qa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build
        run: go build -o comment-checker ./cmd/comment-checker

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Test npm package
        run: node --test npm/comment-checker/*.test.js

  build:
    needs: qa
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install MinGW (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: Build (Unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-g++' || '' }}
        run: |
          if [ "${{ matrix.goos }}" = "linux" ]; then
            go build -ldflags="-s -w -extldflags '-static'" -o comment-checker ./cmd/comment-checker
          else
            go build -ldflags="-s -w" -o comment-checker ./cmd/comment-checker
          fi
          tar -czvf comment-checker_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz comment-checker LICENSE README.md

      - name: Build (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: C:\msys64\mingw64\bin\gcc.exe
          CXX: C:\msys64\mingw64\bin\g++.exe
          CGO_LDFLAGS: -static -static-libgcc -static-libstdc++
        run: |
          go build -ldflags="-s -w -extldflags '-static'" -o comment-checker.exe ./cmd/comment-checker
          & "C:\msys64\mingw64\bin\objdump.exe" -p comment-checker.exe | Tee-Object -FilePath windows-dependencies.txt
          $forbiddenDlls = @(
            "libstdc++-6.dll",
            "libgcc_s_seh-1.dll",
            "libgcc_s_dw2-1.dll",
            "libwinpthread-1.dll"
          )
          foreach ($dll in $forbiddenDlls) {
            if (Select-String -Path windows-dependencies.txt -Pattern ([regex]::Escape($dll)) -Quiet) {
              throw "Windows binary still references MinGW runtime DLL: $dll"
            }
          }
          Compress-Archive -Path comment-checker.exe, LICENSE, README.md -DestinationPath comment-checker_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

      - name: Upload artifact (Unix)
        if: matrix.goos != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: comment-checker_${{ matrix.goos }}_${{ matrix.goarch }}
          path: comment-checker_*.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: comment-checker_${{ matrix.goos }}_${{ matrix.goarch }}
          path: comment-checker_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- ./*.tar.gz ./*.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## Installation

            ### npm (Recommended)
            ```bash
            npm install -g @code-yeongyu/comment-checker
            # or
            bun add -g @code-yeongyu/comment-checker
            ```

            ### Homebrew (macOS)
            ```bash
            brew tap code-yeongyu/tap
            brew install comment-checker
            ```

            ### Go Install
            ```bash
            go install github.com/code-yeongyu/go-claude-code-comment-checker/cmd/comment-checker@latest
            ```

            ### Manual Download
            Download the appropriate binary for your platform from the assets below.
            
            **Supported Platforms:**
            - macOS (arm64, x64)
            - Linux (arm64, x64)
            - Windows (x64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: comment-checker_darwin_arm64
          path: artifacts

      - name: Download darwin-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: comment-checker_darwin_amd64
          path: artifacts

      - name: Get checksums
        id: checksums
        run: |
          ARM64_SHA=$(sha256sum "artifacts/comment-checker_${{ github.ref_name }}_darwin_arm64.tar.gz" | cut -d ' ' -f 1)
          AMD64_SHA=$(sha256sum "artifacts/comment-checker_${{ github.ref_name }}_darwin_amd64.tar.gz" | cut -d ' ' -f 1)
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$AMD64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          
          cat > formula.rb << 'EOF'
          class CommentChecker < Formula
            desc "Multi-language comment detection hook for Claude Code. 100% vibe coded."
            homepage "https://github.com/code-yeongyu/go-claude-code-comment-checker"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/code-yeongyu/go-claude-code-comment-checker/releases/download/vVERSION_PLACEHOLDER/comment-checker_vVERSION_PLACEHOLDER_darwin_arm64.tar.gz"
                sha256 "ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/code-yeongyu/go-claude-code-comment-checker/releases/download/vVERSION_PLACEHOLDER/comment-checker_vVERSION_PLACEHOLDER_darwin_amd64.tar.gz"
                sha256 "AMD64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "comment-checker"
            end

            test do
              system "#{bin}/comment-checker", "--help"
            end
          end
          EOF
          
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" formula.rb
          sed -i "s/ARM64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.arm64_sha }}/g" formula.rb
          sed -i "s/AMD64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.amd64_sha }}/g" formula.rb
          
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/code-yeongyu/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp formula.rb homebrew-tap/Formula/comment-checker.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/comment-checker.rb
          git commit -m "Update comment-checker to v$VERSION"
          git push

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG="${{ github.ref_name }}"
          PACKAGES=(
            npm/comment-checker-darwin-arm64
            npm/comment-checker-darwin-x64
            npm/comment-checker-linux-arm64
            npm/comment-checker-linux-x64
            npm/comment-checker-win32-x64
            npm/comment-checker
          )

          for PACKAGE in "${PACKAGES[@]}"; do
            jq --arg v "$VERSION" '.version = $v' "$PACKAGE/package.json" > "$PACKAGE/package.json.tmp"
            mv "$PACKAGE/package.json.tmp" "$PACKAGE/package.json"
          done

          jq --arg v "$VERSION" '
            .optionalDependencies = {
              "@code-yeongyu/comment-checker-darwin-arm64": $v,
              "@code-yeongyu/comment-checker-darwin-x64": $v,
              "@code-yeongyu/comment-checker-linux-arm64": $v,
              "@code-yeongyu/comment-checker-linux-x64": $v,
              "@code-yeongyu/comment-checker-win32-x64": $v
            }
          ' npm/comment-checker/package.json > npm/comment-checker/package.json.tmp
          mv npm/comment-checker/package.json.tmp npm/comment-checker/package.json

          mkdir -p npm/comment-checker-darwin-arm64/bin
          mkdir -p npm/comment-checker-darwin-x64/bin
          mkdir -p npm/comment-checker-linux-arm64/bin
          mkdir -p npm/comment-checker-linux-x64/bin
          mkdir -p npm/comment-checker-win32-x64/bin

          mkdir -p /tmp/comment-checker-npm/darwin-arm64
          mkdir -p /tmp/comment-checker-npm/darwin-amd64
          mkdir -p /tmp/comment-checker-npm/linux-arm64
          mkdir -p /tmp/comment-checker-npm/linux-amd64
          mkdir -p /tmp/comment-checker-npm/windows-amd64

          tar -xzf "artifacts/comment-checker_${TAG}_darwin_arm64.tar.gz" -C /tmp/comment-checker-npm/darwin-arm64
          tar -xzf "artifacts/comment-checker_${TAG}_darwin_amd64.tar.gz" -C /tmp/comment-checker-npm/darwin-amd64
          tar -xzf "artifacts/comment-checker_${TAG}_linux_arm64.tar.gz" -C /tmp/comment-checker-npm/linux-arm64
          tar -xzf "artifacts/comment-checker_${TAG}_linux_amd64.tar.gz" -C /tmp/comment-checker-npm/linux-amd64
          unzip -o "artifacts/comment-checker_${TAG}_windows_amd64.zip" -d /tmp/comment-checker-npm/windows-amd64

          cp /tmp/comment-checker-npm/darwin-arm64/comment-checker npm/comment-checker-darwin-arm64/bin/comment-checker
          cp /tmp/comment-checker-npm/darwin-amd64/comment-checker npm/comment-checker-darwin-x64/bin/comment-checker
          cp /tmp/comment-checker-npm/linux-arm64/comment-checker npm/comment-checker-linux-arm64/bin/comment-checker
          cp /tmp/comment-checker-npm/linux-amd64/comment-checker npm/comment-checker-linux-x64/bin/comment-checker
          cp /tmp/comment-checker-npm/windows-amd64/comment-checker.exe npm/comment-checker-win32-x64/bin/comment-checker.exe

          chmod +x npm/comment-checker-darwin-arm64/bin/comment-checker
          chmod +x npm/comment-checker-darwin-x64/bin/comment-checker
          chmod +x npm/comment-checker-linux-arm64/bin/comment-checker
          chmod +x npm/comment-checker-linux-x64/bin/comment-checker

      - name: Test npm package
        run: node --test npm/comment-checker/*.test.js

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          root_pack=$(cd npm/comment-checker && npm pack --dry-run --json)
          echo "$root_pack"
          echo "$root_pack" | jq -e '
            .[0].files
            | map(.path)
            | contains(["cli.js", "index.js", "package.json", "postinstall.js"])
              and all(.[]; startswith("bin/") | not)
          '

          for PACKAGE in \
            npm/comment-checker-darwin-arm64 \
            npm/comment-checker-darwin-x64 \
            npm/comment-checker-linux-arm64 \
            npm/comment-checker-linux-x64
          do
            pack=$(cd "$PACKAGE" && npm pack --dry-run --json)
            echo "$pack"
            echo "$pack" | jq -e '.[0].files | any(.path == "bin/comment-checker")'
          done

          win_pack=$(cd npm/comment-checker-win32-x64 && npm pack --dry-run --json)
          echo "$win_pack"
          echo "$win_pack" | jq -e '.[0].files | any(.path == "bin/comment-checker.exe")'

      - name: Publish platform packages to npm
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          for PACKAGE in \
            npm/comment-checker-darwin-arm64 \
            npm/comment-checker-darwin-x64 \
            npm/comment-checker-linux-arm64 \
            npm/comment-checker-linux-x64 \
            npm/comment-checker-win32-x64
          do
            (cd "$PACKAGE" && npm publish --access public --provenance)
          done

      - name: Publish root package to npm
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          cd npm/comment-checker
          npm publish --access public --provenance
