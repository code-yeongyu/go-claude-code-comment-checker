name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  TSLP_LINK_MODE: static

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Set up LLVM for wasm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy core
        run: cargo clippy -p comment-checker --all-targets --all-features -- -D warnings

      - name: Clippy bindings
        run: |
          cargo clippy -p comment-checker-napi --all-targets -- -D warnings
          cargo clippy -p comment-checker-wasm --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test -p comment-checker --all-targets --all-features

      - name: Compile benchmarks
        run: cargo bench -p comment-checker --bench comment_checker --no-run

      - name: Build wasm binding
        env:
          CC_wasm32_unknown_unknown: clang
        run: cargo build -p comment-checker-wasm --lib --target wasm32-unknown-unknown --locked

      - name: Build N-API binding
        run: cargo build -p comment-checker-napi --release --locked

      - name: Test npm package
        run: node --test npm/comment-checker/*.test.js

  build:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
            binary_name: comment-checker
            archive_ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
            binary_name: comment-checker
            archive_ext: tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
            binary_name: comment-checker
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
            binary_name: comment-checker
            archive_ext: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
            binary_name: comment-checker.exe
            archive_ext: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p comment-checker --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          artifact="comment-checker_${{ github.ref_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz"
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" package/comment-checker
          chmod +x package/comment-checker
          cp LICENSE README.md package/
          tar -czf "$artifact" -C package comment-checker LICENSE README.md

      - name: Package Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $artifact = "comment-checker_${{ github.ref_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" package/
          Copy-Item LICENSE, README.md package/
          Compress-Archive -Path package/* -DestinationPath $artifact -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: comment-checker_${{ matrix.os_name }}_${{ matrix.arch }}
          path: comment-checker_*.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- ./*.tar.gz ./*.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## Installation

            ### npm (Recommended)
            ```bash
            npm install -g @code-yeongyu/comment-checker
            # or
            bun add -g @code-yeongyu/comment-checker
            ```

            ### Homebrew (macOS)
            ```bash
            brew tap code-yeongyu/tap
            brew install comment-checker
            ```

            ### Manual Download
            Download the appropriate Rust native binary for your platform from the assets below.

            **Supported Platforms:**
            - macOS (arm64, x64)
            - Linux (arm64, x64)
            - Windows (x64)

            The Rust library also has CI-enforced wasm32 and N-API buildability gates for future integrations.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: comment-checker_darwin_arm64
          path: artifacts

      - name: Download darwin-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: comment-checker_darwin_amd64
          path: artifacts

      - name: Get checksums
        id: checksums
        run: |
          ARM64_SHA=$(sha256sum "artifacts/comment-checker_${{ github.ref_name }}_darwin_arm64.tar.gz" | cut -d ' ' -f 1)
          AMD64_SHA=$(sha256sum "artifacts/comment-checker_${{ github.ref_name }}_darwin_amd64.tar.gz" | cut -d ' ' -f 1)
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$AMD64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}

          cat > formula.rb << 'EOF'
          class CommentChecker < Formula
            desc "Multi-language comment detection hook for Claude Code and OpenCode"
            homepage "https://github.com/code-yeongyu/go-claude-code-comment-checker"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/code-yeongyu/go-claude-code-comment-checker/releases/download/vVERSION_PLACEHOLDER/comment-checker_vVERSION_PLACEHOLDER_darwin_arm64.tar.gz"
                sha256 "ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/code-yeongyu/go-claude-code-comment-checker/releases/download/vVERSION_PLACEHOLDER/comment-checker_vVERSION_PLACEHOLDER_darwin_amd64.tar.gz"
                sha256 "AMD64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "comment-checker"
            end

            test do
              system "#{bin}/comment-checker", "--help"
            end
          end
          EOF

          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" formula.rb
          sed -i "s/ARM64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.arm64_sha }}/g" formula.rb
          sed -i "s/AMD64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.amd64_sha }}/g" formula.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/code-yeongyu/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp formula.rb homebrew-tap/Formula/comment-checker.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/comment-checker.rb
          git commit -m "Update comment-checker to v$VERSION"
          git push

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare npm package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG="${{ github.ref_name }}"
          jq --arg v "$VERSION" 'del(.optionalDependencies) | .version = $v' \
            npm/comment-checker/package.json > npm/comment-checker/package.json.tmp
          mv npm/comment-checker/package.json.tmp npm/comment-checker/package.json

          mkdir -p npm/comment-checker/vendor/darwin-arm64
          mkdir -p npm/comment-checker/vendor/darwin-x64
          mkdir -p npm/comment-checker/vendor/linux-arm64
          mkdir -p npm/comment-checker/vendor/linux-x64
          mkdir -p npm/comment-checker/vendor/win32-x64

          mkdir -p /tmp/comment-checker-npm/darwin-arm64
          mkdir -p /tmp/comment-checker-npm/darwin-amd64
          mkdir -p /tmp/comment-checker-npm/linux-arm64
          mkdir -p /tmp/comment-checker-npm/linux-amd64
          mkdir -p /tmp/comment-checker-npm/windows-amd64

          tar -xzf "artifacts/comment-checker_${TAG}_darwin_arm64.tar.gz" -C /tmp/comment-checker-npm/darwin-arm64
          tar -xzf "artifacts/comment-checker_${TAG}_darwin_amd64.tar.gz" -C /tmp/comment-checker-npm/darwin-amd64
          tar -xzf "artifacts/comment-checker_${TAG}_linux_arm64.tar.gz" -C /tmp/comment-checker-npm/linux-arm64
          tar -xzf "artifacts/comment-checker_${TAG}_linux_amd64.tar.gz" -C /tmp/comment-checker-npm/linux-amd64
          unzip -o "artifacts/comment-checker_${TAG}_windows_amd64.zip" -d /tmp/comment-checker-npm/windows-amd64

          cp /tmp/comment-checker-npm/darwin-arm64/comment-checker npm/comment-checker/vendor/darwin-arm64/comment-checker
          cp /tmp/comment-checker-npm/darwin-amd64/comment-checker npm/comment-checker/vendor/darwin-x64/comment-checker
          cp /tmp/comment-checker-npm/linux-arm64/comment-checker npm/comment-checker/vendor/linux-arm64/comment-checker
          cp /tmp/comment-checker-npm/linux-amd64/comment-checker npm/comment-checker/vendor/linux-x64/comment-checker
          cp /tmp/comment-checker-npm/windows-amd64/comment-checker.exe npm/comment-checker/vendor/win32-x64/comment-checker.exe

          chmod +x npm/comment-checker/vendor/darwin-arm64/comment-checker
          chmod +x npm/comment-checker/vendor/darwin-x64/comment-checker
          chmod +x npm/comment-checker/vendor/linux-arm64/comment-checker
          chmod +x npm/comment-checker/vendor/linux-x64/comment-checker

      - name: Test npm package
        run: node --test npm/comment-checker/*.test.js

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          root_pack=$(cd npm/comment-checker && npm pack --dry-run --json)
          echo "$root_pack"
          jq -e 'has("optionalDependencies") | not' npm/comment-checker/package.json
          echo "$root_pack" | jq -e '
            .[0].files
            | map(.path)
            | contains([
                "cli.js",
                "index.js",
                "package.json",
                "postinstall.js",
                "vendor/darwin-arm64/comment-checker",
                "vendor/darwin-x64/comment-checker",
                "vendor/linux-arm64/comment-checker",
                "vendor/linux-x64/comment-checker",
                "vendor/win32-x64/comment-checker.exe"
              ])
              and all(.[]; startswith("bin/") | not)
          '
          echo "$root_pack" | jq -e '
            .[0].files
            | any(.path == "vendor/darwin-arm64/comment-checker" and .mode == 493)
              and any(.path == "vendor/darwin-x64/comment-checker" and .mode == 493)
              and any(.path == "vendor/linux-arm64/comment-checker" and .mode == 493)
              and any(.path == "vendor/linux-x64/comment-checker" and .mode == 493)
          '

      - name: Publish root package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          cd npm/comment-checker
          npm publish --access public --provenance
