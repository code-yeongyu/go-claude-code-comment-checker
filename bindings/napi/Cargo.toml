[package]
name = "comment-checker-napi"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "N-API bindings for comment-checker"
repository = "https://github.com/code-yeongyu/go-claude-code-comment-checker"
keywords = ["comments", "tree-sitter", "napi", "node-api", "hook"]
categories = ["development-tools"]
publish = false

[package.metadata.cargo-machete]
ignored = ["napi"]

[lib]
crate-type = ["cdylib"]

[dependencies]
comment-checker = { path = "../.." }
napi = { version = "3.9.0", default-features = false, features = ["napi4"] }
napi-derive = "3.5.6"

[build-dependencies]
napi-build = "2.3.2"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
mem_forget = "deny"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
